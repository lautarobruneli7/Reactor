[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-quimico"
version = "0.4.0"
description = "Simulador visual de formulación y calidad de productos químicos y farmacéuticos (catálogo de compuestos y reacciones; ejemplo principal: ibuprofeno)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "sqlalchemy>=2.0",   # base persistente (usuarios, ensayos, auditoría): SQLite o PostgreSQL
  "reportlab>=4.0",    # reportes en PDF
  "openpyxl>=3.1",     # reportes en Excel
]

[project.optional-dependencies]
# Propiedades moleculares (peso molecular, logP, TPSA...). El motor funciona sin esto.
quimica = ["rdkit>=2023.9"]
# Para usar PostgreSQL como base persistente (SIM_DATABASE_URL=postgresql+psycopg://...)
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]
# Solo para REGENERAR el catálogo (python scripts/construir_datos.py) y las densidades
# (python scripts/construir_densidades.py); la app corre sin esto.
datos = ["periodictable>=2.0", "chemicals>=1.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
